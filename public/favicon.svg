<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <defs>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F4FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#3B82F6" flood-opacity="0.2"/>
    </filter>
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#1E3A5F" flood-opacity="0.08"/>
    </filter>
    <style>
      .primary { fill: #3B82F6; }
      .primary-dark { fill: #2563EB; }
      .stroke { fill: none; stroke: #3B82F6; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      text { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; font-weight: 700; fill: #1F2937; }
      .text-accent { fill: #3B82F6; }
    </style>
  </defs>

  <!-- Fondo circular decorativo -->
  <circle cx="210" cy="180" r="105" fill="#EFF6FF" opacity="0.6"/>
  
  <!-- Círculo exterior -->
  <circle cx="210" cy="180" r="92" class="stroke" filter="url(#shadow)" stroke="url(#circleGrad)" stroke-width="8"/>

  <!-- Cruz -->
  <rect x="180" y="110" width="60" height="140" rx="8" class="primary" filter="url(#shadow)"/>
  <rect x="140" y="150" width="140" height="60" rx="8" class="primary" filter="url(#shadow)"/>

  <!-- Brillo en la cruz -->
  <rect x="184" y="114" width="16" height="132" rx="4" fill="white" opacity="0.25"/>
  <rect x="144" y="154" width="132" height="12" rx="4" fill="white" opacity="0.25"/>

  <!-- Mano -->
  <path class="primary" filter="url(#shadow)"
    d="M123 248 C135 232 151 222 171 220 C189 218 207 221 223 228 C239 235 252 243 266 244 C282 245 293 244 303 243 C311 242 318 247 319 255 C320 263 313 269 302 271 C281 275 258 273 236 268 C214 263 193 258 173 257 C156 256 140 257 123 262 Z"/>

  <!-- Pulgar -->
  <path class="primary-dark"
    d="M218 232 C236 235 250 240 262 249 C247 248 231 244 218 239 Z"/>

  <!-- Línea ECG -->
  <path class="stroke"
    d="M304 180 L332 180 L344 167 L356 199 L377 131 L399 209 L419 181 L680 181"/>

  <!-- Punto ECG -->
  <circle cx="304" cy="180" r="5" fill="#3B82F6"/>
  <circle cx="680" cy="181" r="5" fill="#3B82F6"/>

  <!-- Texto principal -->
  <text x="208" y="395" text-anchor="middle" font-size="68" filter="url(#textShadow)">
    <tspan class="text-accent">Mi</tspan>turno
  </text>

  <!-- Subtítulo -->
  <text x="460" y="440" text-anchor="middle" font-size="16" font-weight="500" fill="#6B7280" letter-spacing="2">
    SISTEMA HOSPITALARIO
  </text>

  <!-- Línea decorativa debajo del texto -->
  <rect x="350" y="455" width="220" height="3" rx="1.5" fill="#EFF6FF"/>
</svg>